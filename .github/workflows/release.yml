name: Release

# Tag-triggered. Building is decoupled from publishing so the only job holding
# OIDC `id-token: write` is the minimal publish step.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # keyless build-provenance attestation (OIDC)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Verify tag matches package version
        run: |
          ver=$(grep -oE '__version__ = "[^"]+"' src/grundschutz_mcp/__init__.py | grep -oE '[0-9][^"]*')
          test "v$ver" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != version v$ver"; exit 1; }
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
      - name: Sync
        # --locked in the one job that signs, for the same reason ci.yml insists
        # on it: the artifact must be built from the reviewed resolution.
        run: uv sync --locked
      - name: Build sdist + wheel
        run: uv build
      - name: Assert the artifacts carry no BSI data
        # The control ADR-0011's licence argument rests on. Runs before
        # provenance is attested, so nothing unverified is ever signed. The same
        # script runs on every pull request in ci.yml, so a breach is caught at
        # review time rather than when a tag already exists.
        run: uv run --no-sync python scripts/check_artifacts.py
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-path: "dist/*"
      - name: Upload dist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    # Never publish from a fork: the OIDC subject must be this repository.
    if: github.repository == 'SamuelBlickle/grundschutz-mcp'
    runs-on: ubuntu-latest
    # Configure this environment on GitHub and as the PyPI trusted publisher
    # (see RELEASING.md). Add required-reviewer protection here for a manual gate.
    environment:
      name: pypi
      url: https://pypi.org/p/grundschutz-mcp
    permissions:
      id-token: write       # OIDC for PyPI Trusted Publishing + Sigstore signing
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI (Trusted Publishing, tokenless)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        # No password/token: uses OIDC Trusted Publishing and Sigstore-signs the
        # artifacts. Activation requires the PyPI trusted-publisher config below.
