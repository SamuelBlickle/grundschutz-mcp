name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # weekly drift monitor against the pinned BSI source

# Least privilege: jobs only read the repo; no write scopes on GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d  # v10.0.0
      - name: Sync
        # --locked: fail rather than re-resolve. In a dependency PR the lockfile
        # IS the reviewed artifact, so CI has to test the committed resolution;
        # without this a stale or hand-edited lock silently resolves to
        # something else and the green check attests to the wrong tree.
        run: uv sync --locked --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run pyright
      - name: Unit tests (offline)
        run: uv run pytest -m "not network"

  secrets:
    # Credential scanner (complements the local leak-gate, which does not travel
    # with clones). Scans the full history; fails the build on any finding.
    # Intentionally has no `if:` guard — it must run on every push and PR.
    runs-on: ubuntu-latest
    permissions:
      contents: read  # explicit job scope, independent of the top-level default
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  drift-monitor:
    # Runs on schedule and main. Hits the pinned BSI source and fails loudly if
    # the OSCAL shape no longer maps. Surfaces upstream drift before users do.
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d  # v10.0.0
      - name: Sync
        run: uv sync --locked --extra dev
      - name: Schema test against pinned BSI data
        run: uv run pytest -m network

  artifacts:
    # The licence boundary (ADR-0011) rests on shipping nothing derived from BSI
    # content. release.yml enforces that before signing, but a tag is far too
    # late to learn about a breach, so the same script runs on every PR. Needs
    # the network: it reads the pinned catalog to know what BSI prose looks like.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d  # v10.0.0
      - name: Sync
        run: uv sync --locked
      - name: Build sdist + wheel
        run: uv build
      - name: Assert the artifacts carry no BSI data
        # Same invocation as release.yml, so PRs exercise the release path.
        run: uv run --no-sync python scripts/check_artifacts.py
