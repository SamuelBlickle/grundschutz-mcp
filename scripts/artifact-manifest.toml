# Exact member list of each published artifact.
#
# This is the primary control behind ADR-0011: a file that is not listed here
# cannot ship, whatever it contains and however it is encoded. Adding one is a
# reviewed diff rather than a side effect of what sits in the working tree.
#
# Version-bearing roots are normalised away: the sdist root directory is
# stripped, and the wheel's "grundschutz_mcp-<version>.dist-info" becomes
# "<dist-info>". Regenerate with:
#   uv build && uv run python scripts/check_artifacts.py --update-manifest

