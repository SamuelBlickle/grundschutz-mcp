[project]
name = "grundschutz-mcp"
version = "1.1.0"
description = "MCP server that makes the BSI IT-Grundschutz++ compendium queryable for AI agents and ISMS tooling."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Samuel Blickle" }]
keywords = ["mcp", "bsi", "it-grundschutz", "oscal", "compliance", "isms"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
]

dependencies = [
    # official MCP SDK. Upper bound is deliberate: majors rename the server
    # class and model fields (2.0 did both), so bumping it is a reviewed step.
    "mcp>=2.0.0,<3",
    "pydantic>=2.6",     # internal model + validation
    "httpx>=0.27",       # runtime loading of the pinned BSI data
]

[project.urls]
Homepage = "https://samuelblickle.de"
Repository = "https://github.com/SamuelBlickle/grundschutz-mcp"

[project.scripts]
grundschutz-mcp = "grundschutz_mcp.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "pyright>=1.1.350",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grundschutz_mcp"]

# Explicit allowlist, not the default "whole VCS tree". Invariant 5 and ADR-0011
# rest on shipping nothing derived from BSI content, so what goes into an
# artifact is a reviewed decision rather than a side effect of what happens to
# sit in the working tree. Drops .claude/ (agent prompts and hooks), .github/
# and uv.lock, none of which an sdist consumer needs.
#
# CLAUDE.md stays: docs/adr ships, and every record there refers to the
# invariants as stated in CLAUDE.md. Shipping the reasoning without the
# statement it reasons about would leave the sdist self-referentially broken.
[tool.hatch.build.targets.sdist]
include = [
    "src/grundschutz_mcp",
    "tests",
    "docs",
    "scripts",
    "README.md",
    "LICENSE",
    "NOTICE",
    "CLAUDE.md",
    "CONTRIBUTING.md",
    "SECURITY.md",
    "VERSIONING.md",
    "RELEASING.md",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "tests", "scripts"]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
